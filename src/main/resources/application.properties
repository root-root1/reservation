spring.application.name=seat_reservation

# Identity comes from JWTs only; no form login, no in-memory user,
# so the default generated password is not wanted.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Load .env when present so an IDE run needs no run-config setup.
# Optional: in Docker and on the deploy platform the values arrive as real
# environment variables and no file exists. Real env vars win over the file.
spring.config.import=optional:file:.env[.properties]

# --- datasource -------------------------------------------------------------
# No defaults on connection details: a missing value must stop the boot,
# not silently fall back to something wrong.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_SIZE:20}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=5000
spring.datasource.hikari.pool-name=seats-pool

# --- jpa --------------------------------------------------------------------
# Flyway owns the schema; Hibernate only checks the mapping agrees with it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true

# --- flyway -----------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# --- transactions -----------------------------------------------------------
# Lock waits must fail fast and become a decline, never a hung request thread.
spring.jpa.properties.jakarta.persistence.lock.timeout=2000

# --- server -----------------------------------------------------------------
server.port=${PORT:8080}
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}
server.tomcat.accept-count=1000
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-message=never
server.error.include-stacktrace=never

# --- actuator: /healthz, /healthz/liveness, /healthz/readiness, /metrics -----
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoints.web.path-mapping.health=healthz
management.endpoints.web.path-mapping.prometheus=metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.health.redis.enabled=false
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=10ms,50ms,100ms,250ms,500ms,1s

# Wire format is snake_case: price_paise, idempotency_key, reservation_id.
spring.jackson.property-naming-strategy=SNAKE_CASE

# --- logging ----------------------------------------------------------------
#logging.structured.format.console=ecs
logging.level.root=INFO
logging.level.com.social.seat_reservation=INFO
logging.level.org.hibernate.SQL=WARN

# --- application ------------------------------------------------------------
app.reservation.per-user-limit=${APP_RESERVATION_PER_USER_LIMIT:4}
app.reservation.hold-ttl-seconds=${APP_RESERVATION_HOLD_TTL_SECONDS:120}
app.reservation.sweep-interval-ms=${APP_RESERVATION_SWEEP_INTERVAL_MS:30000}
app.metrics.gauge-refresh-ms=${APP_METRICS_GAUGE_REFRESH_MS:5000}
app.auth.jwt-secret=${JWT_SECRET}
app.auth.jwt-issuer=seat-reservation
app.auth.token-ttl-minutes=${APP_AUTH_TOKEN_TTL_MINUTES:120}
app.auth.admin-username=${ADMIN_USERNAME:}
app.auth.admin-password=${ADMIN_PASSWORD:}
